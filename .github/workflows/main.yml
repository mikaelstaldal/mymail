# Builds the project, publishes the browser-only demo to GitHub Pages, and
# publishes the binaries as a rolling `latest` release.
#
# The demo needs no backend (see README § Demo mode), so the whole site is the
# static bundle `-demo-bundle` writes. It is published only from main, and only
# after ./build.sh has passed — which includes the frontend tests, the Go tests,
# and the linter — so a broken commit never reaches the published demo.
name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one midway: a cancelled deploy can
# leave the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Overrides the workflow default only to add contents: write, which the
    # release step needs to move the `latest` tag and upload the binary.
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # build.sh expects these on $PATH and never installs anything itself (see
      # AGENTS.md). Every version is pinned, and --ignore-scripts keeps npm from
      # running install hooks. ogen's version is read from go.mod so the
      # generator always matches the runtime library the generated code links
      # against.
      - name: Install build tools
        run: |
          go install "github.com/ogen-go/ogen/cmd/ogen@$(go list -m -f '{{.Version}}' github.com/ogen-go/ogen)"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          npm install -g --ignore-scripts typescript@7.0.2 openapi-typescript@7.13.0

      # Resolves where the site will be served from, so the demo can be built
      # for that path. Requires Pages to be enabled with "GitHub Actions" as its
      # source — see README § Demo mode.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Silent on success; on failure it prints the failing step and exits
      # non-zero, which fails the job before anything is published.
      - name: Build
        run: ./build.sh

      # Playwright is deliberately NOT a build.sh dependency: build.sh has to keep
      # working for anyone who does not have a browser toolchain, so the e2e
      # wiring lives here instead. The version comes from e2e/package-lock.json
      # via `npm ci`, and `playwright install --with-deps` then fetches the
      # browser build that version expects — the two are matched, so neither is
      # pinned separately here.
      #
      # After ./build.sh, not before: downloading a browser costs a minute or so
      # and nothing here depends on it, so a compile or lint failure should not
      # pay for it.
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      # Placed to gate publishing rather than to run alongside it: these
      # assertions are this repo's whole half of the cross-repo sidebar-footer
      # contract (see AGENTS.md), and nothing else in this repo checks any of it,
      # so a build that breaks it must not reach Pages or the release.
      #
      # Placed, not proven: this step has never executed. The workflow triggers on
      # push to `main` (see `on:` above) and the branch that adds it is unpushed,
      # so the first such push is also the first run of `npm ci`, of
      # `playwright install`, and of the suite anywhere but a developer's machine.
      # Do not describe it as a gate elsewhere in the repo until it has run once.
      #
      # test-e2e.sh starts the
      # server from the binary ./build.sh just produced — one built at a different
      # time would embed different web/static/, and the suite would be measuring
      # something other than this commit. 12.8s wall clock for 33 tests, read
      # locally in this container — a runner's figure will differ.
      - name: End-to-end tests
        run: ./test-e2e.sh

      # Without this a failure here yields only the list reporter's text, and a
      # geometry assertion ("expected 8, received 9.5") is close to undebuggable
      # from that alone. Once this workflow does run, the suite stands between the
      # build and both Pages and the release, so a red run has to leave enough
      # behind to diagnose it without reproducing locally.
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # base_url carries the full public URL, including a custom domain if one
      # is configured, so the bundle's <base href> matches wherever Pages
      # actually serves it.
      - name: Build the demo bundle
        env:
          # Via the environment rather than spliced into the command line, so
          # the value can never be read as shell syntax.
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # An empty value would silently build for the origin root, which is
          # the wrong base path for a project site and would publish a demo
          # that cannot load its own scripts. Fail loudly instead.
          if [ -z "$PAGES_URL" ]; then
            echo "Pages base URL is empty — is Pages enabled with GitHub Actions as its source?" >&2
            exit 1
          fi
          ./mymail -demo-bundle site -public-url "$PAGES_URL"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Publishes the binaries ./build.sh produced as a rolling release, so
      # https://github.com/<owner>/<repo>/releases/latest always serves the
      # newest green build of main. `gh` is preinstalled on the runner, so this
      # pulls in no third-party action.
      #
      # A rolling release means the `latest` tag has to move: delete the
      # release and its tag, then recreate both at this commit. The delete is
      # tolerant of there being nothing to delete (the first run), but the
      # create is not — if that fails, the job fails.
      - name: Release the binary
        env:
          GH_TOKEN: ${{ github.token }}
          # Via the environment rather than spliced into the command line, so
          # the value can never be read as shell syntax.
          SHA: ${{ github.sha }}
        run: |
          # The asset name says what it is: the static linux/amd64 binaries,
          # which is the only platform ./build.sh targets here.
          tar -czf mymail-linux-amd64.tar.gz mymail mymail-lda
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mymail-linux-amd64.tar.gz \
            --target "$SHA" \
            --title "Latest build from main" \
            --notes "Automated build of \`main\` at commit $SHA."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
