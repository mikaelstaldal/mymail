# Builds the project, publishes the browser-only demo to GitHub Pages, and
# publishes the binaries as a rolling `latest` release.
#
# The demo needs no backend (see README § Demo mode), so the whole site is the
# static bundle `-demo-bundle` writes. It is published only from main, and only
# after ./build.sh has passed — which includes the frontend tests, the Go tests,
# and the linter — so a broken commit never reaches the published demo.
name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one midway: a cancelled deploy can
# leave the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Overrides the workflow default only to add contents: write, which the
    # release step needs to move the `latest` tag and upload the binary.
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # build.sh expects these on $PATH and never installs anything itself (see
      # AGENTS.md). Every version is pinned, and --ignore-scripts keeps npm from
      # running install hooks. ogen's version is read from go.mod so the
      # generator always matches the runtime library the generated code links
      # against.
      - name: Install build tools
        run: |
          go install "github.com/ogen-go/ogen/cmd/ogen@$(go list -m -f '{{.Version}}' github.com/ogen-go/ogen)"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          npm install -g --ignore-scripts typescript@7.0.2 openapi-typescript@7.13.0

      # Resolves where the site will be served from, so the demo can be built
      # for that path. Requires Pages to be enabled with "GitHub Actions" as its
      # source — see README § Demo mode.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Silent on success; on failure it prints the failing step and exits
      # non-zero, which fails the job before anything is published.
      - name: Build
        run: ./build.sh

      # base_url carries the full public URL, including a custom domain if one
      # is configured, so the bundle's <base href> matches wherever Pages
      # actually serves it.
      - name: Build the demo bundle
        env:
          # Via the environment rather than spliced into the command line, so
          # the value can never be read as shell syntax.
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # An empty value would silently build for the origin root, which is
          # the wrong base path for a project site and would publish a demo
          # that cannot load its own scripts. Fail loudly instead.
          if [ -z "$PAGES_URL" ]; then
            echo "Pages base URL is empty — is Pages enabled with GitHub Actions as its source?" >&2
            exit 1
          fi
          ./mymail -demo-bundle site -public-url "$PAGES_URL"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Publishes the binaries ./build.sh produced as a rolling release, so
      # https://github.com/<owner>/<repo>/releases/latest always serves the
      # newest green build of main. `gh` is preinstalled on the runner, so this
      # pulls in no third-party action.
      #
      # A rolling release means the `latest` tag has to move: delete the
      # release and its tag, then recreate both at this commit. The delete is
      # tolerant of there being nothing to delete (the first run), but the
      # create is not — if that fails, the job fails.
      - name: Release the binary
        env:
          GH_TOKEN: ${{ github.token }}
          # Via the environment rather than spliced into the command line, so
          # the value can never be read as shell syntax.
          SHA: ${{ github.sha }}
        run: |
          # The asset name says what it is: the static linux/amd64 binaries,
          # which is the only platform ./build.sh targets here.
          tar -czf mymail-linux-amd64.tar.gz mymail mymail-lda
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mymail-linux-amd64.tar.gz \
            --target "$SHA" \
            --title "Latest build from main" \
            --notes "Automated build of \`main\` at commit $SHA."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
