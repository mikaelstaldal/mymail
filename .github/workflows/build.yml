# Builds the project
name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

# One deployment at a time, and never cancel one midway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # build.sh expects these on $PATH and never installs anything itself (see
      # AGENTS.md). Every version is pinned, and --ignore-scripts keeps npm from
      # running install hooks. ogen's version is read from go.mod so the
      # generator always matches the runtime library the generated code links
      # against.
      - name: Install build tools
        run: |
          go install "github.com/ogen-go/ogen/cmd/ogen@$(go list -m -f '{{.Version}}' github.com/ogen-go/ogen)"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          npm install -g --ignore-scripts typescript@7.0.2 openapi-typescript@7.13.0

      # Silent on success; on failure it prints the failing step and exits non-zero
      - name: Build
        run: ./build.sh
