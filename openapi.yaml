openapi: 3.0.3
info:
  title: MyMail API
  description: |
    REST API for MyMail — a self-hosted personal email client.

    **Authentication:** When `-basic-auth-file` is configured, all endpoints 
    require HTTP Basic Auth. Missing or invalid credentials return `401 Unauthorized` with
    `WWW-Authenticate: Basic realm="<realm>"` and the body `{"error": "unauthorized"}`. The `401`
    response is not individually listed on each endpoint but applies globally to all authenticated
    endpoints.

    **Error responses** use the schema `{"error": "human-readable message"}` with status
    `400`, `401`, `404`, `409`, or `500`.

    **Request body size limit:** 32 MiB, applied to the entire encoded request body. For
    `multipart/form-data` endpoints, this limit covers all parts combined (not per-part).
  version: 1.0.0

servers:
  - url: /api/v1

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Folder:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        position:
          type: integer
        unread_count:
          type: integer
        created_at:
          type: string
          format: date-time
      required: [id, name, slug, position, unread_count, created_at]

    MessageSummary:
      type: object
      properties:
        id:
          type: integer
        folder_id:
          type: integer
        message_id:
          type: string
          nullable: true
        from_addr:
          type: string
        to_addr:
          type: string
        subject:
          type: string
        date:
          type: string
          format: date-time
        read:
          type: boolean
        flagged:
          type: boolean
        has_attachments:
          type: boolean
        send_failed:
          type: boolean
          description: |
            True when the message has at least one send attempt failure (send_failure_count > 0).
            The UI uses this to show a failure badge without fetching the full message detail:
            - In the Scheduled folder: show a yellow warning badge (send is being retried).
            - In the Drafts folder: show a red error badge (message was moved from Scheduled after exhausting all retries).
            - In the Trash folder (folder_id=4): suppress this badge — send_failure_count is
              intentionally preserved in Trash but the message is no longer actionable.
        send_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Non-null only for messages in the Scheduled folder (same invariant as
            `MessageDetail.send_at`). Carried in the summary so the Scheduled folder listing can
            show a "Send at" column without fetching each message.
        snoozed_until:
          type: string
          format: date-time
          nullable: true
          description: |
            Non-null only for messages in the Snoozed folder (same invariant as
            `MessageDetail.snoozed_until`). Carried in the summary so the Snoozed folder listing
            can show a "Snoozed until" column without fetching each message.
        created_at:
          type: string
          format: date-time
      required: [id, folder_id, message_id, from_addr, to_addr, subject, date, read, flagged, has_attachments, send_failed, send_at, snoozed_until, created_at]

    AttachmentMeta:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
      required: [id, filename, content_type, size]

    MessageDetail:
      type: object
      properties:
        id:
          type: integer
        folder_id:
          type: integer
        message_id:
          type: string
          nullable: true
          description: |
            The RFC 5322 Message-ID value, serialized **without** angle brackets
            (e.g. `id@domain`, not `<id@domain>`). Null when the message has no Message-ID.
            Note the asymmetry with `references`, whose elements include angle brackets.
        in_reply_to:
          type: string
          nullable: true
          description: |
            The RFC 5322 In-Reply-To value, serialized **without** angle brackets
            (e.g. `id@domain`, not `<id@domain>`). Null when the header is absent.
            Note the asymmetry with `references`, whose elements include angle brackets.
        references:
          type: array
          items:
            type: string
          description: |
            Parsed References header. Empty array when the header is absent or empty. Each element
            is a raw Message-ID string as it appears in the header, including angle brackets
            (e.g. `<id@domain>`).
        from_addr:
          type: string
        to_addr:
          type: string
        cc_addr:
          type: string
        bcc_addr:
          type: string
        reply_to_addr:
          type: string
        subject:
          type: string
        date:
          type: string
          format: date-time
        body_text:
          type: string
        body_html:
          type: string
        has_external_images:
          type: boolean
          description: |
            True when the message body contains external image URLs (img src with http or https scheme).
            The sanitiser blocks these by default; when true, the UI may offer the user a
            "Load external images" action to re-render the body in a relaxed-CSP iframe.
        send_failed:
          type: boolean
          description: |
            True when the message has at least one send attempt failure (send_failure_count > 0).
            The UI uses folder_id context to distinguish the meaningful states:
            - In the Scheduled folder: show a yellow warning badge (send is being retried).
            - In the Drafts folder: show a red error badge (message was moved from Scheduled after exhausting all retries).
            - In the Trash folder (folder_id=4): suppress this badge — send_failure_count is
              intentionally preserved in Trash but the message is no longer actionable.
        read:
          type: boolean
        flagged:
          type: boolean
        send_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Non-null only for messages in the Scheduled folder. The time at which the
            message will be (or was scheduled to be) sent. When the scheduler moves a
            message from Scheduled to Drafts after exhausting retries, `send_at` is
            cleared (set to NULL) to preserve this invariant.
        send_error:
          type: string
          nullable: true
          description: Non-null when the message has at least one failed send attempt. Contains the last sendmail stderr output (max 4 KB).
        snoozed_until:
          type: string
          format: date-time
          nullable: true
          description: Non-null when the message is in the Snoozed folder. Displayed in the detail pane so the user can see when it will reappear.
        snooze_folder_id:
          type: integer
          nullable: true
          description: |
            The folder the message will return to when the snooze expires (corresponds to the
            `snooze_folder` database column). May be null even when snoozed_until is non-null;
            when null, the scheduler falls back to Inbox (id=1) via COALESCE.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentMeta'
      required: [id, folder_id, message_id, in_reply_to, references, from_addr, to_addr, cc_addr, bcc_addr, reply_to_addr, subject, date, body_text, body_html, has_external_images, send_failed, read, flagged, send_at, send_error, snoozed_until, snooze_folder_id, created_at, updated_at, attachments]

    SendRequest:
      type: object
      description: |
        At least one of `to_addr`, `cc_addr`, or `bcc_addr` must be non-empty. An empty `to_addr`
        is permitted when `cc_addr` or `bcc_addr` is non-empty.
      properties:
        identity_id:
          type: integer
          description: If absent, the default identity is used.
        to_addr:
          type: string
          maxLength: 8192
        cc_addr:
          type: string
          maxLength: 8192
        bcc_addr:
          type: string
          maxLength: 8192
        reply_to_addr:
          type: string
          maxLength: 8192
        subject:
          type: string
          maxLength: 998
        body_text:
          type: string
        body_html:
          type: string
        in_reply_to:
          type: string
          description: |
            Surrounding angle brackets are stripped before storage (e.g. `<id@domain>` is
            stored as `id@domain`), consistent with `references` handling.
        references:
          type: array
          items:
            type: string
          description: |
            Threading Reference IDs. Elements may include or omit angle brackets
            (e.g. `<id@domain>` or `id@domain`); the server strips surrounding angle brackets
            before storage. When reading back via `MessageDetail.references`, elements always
            include angle brackets (e.g. `<id@domain>`).
        send_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Scheduling threshold (applies identically to `/messages/send`,
            `/messages/send-with-attachments`, and `/drafts/{id}/send`):

            - **Scheduled** when `send_at` is non-null AND `send_at > now + 60 seconds`. Response 202.
            - **Immediate** in every other case: null, in the past, equal to now, or within the next
              60 seconds. Response 201.

    DraftRequest:
      type: object
      description: |
        Request body for creating or replacing a draft. All fields are optional so that
        drafts can be saved before all fields have been filled in by the user.

        **PUT replacement semantics:** PUT replaces the draft entirely. Any field omitted from
        the request body is cleared (treated as the empty string for text fields, `null` for
        `identity_id` and `send_at`, and the empty list for `references`). To preserve a value
        across PUT, the client must include it explicitly in every PUT body. POST follows the
        same model — omitted fields default to their empty/zero value.
      properties:
        identity_id:
          type: integer
          description: |
            If absent, `identity_id` is stored as NULL and `from_addr` is set to the current
            default identity's address. If no identities exist at all (first-run state),
            `from_addr` is stored as empty string and 201 is returned — drafts may be saved
            before any identity exists. If present, `from_addr` is set to the specified
            identity's address. If the supplied `identity_id` does not match any existing
            identity, the server returns 400 with `{"error": "identity not found"}`.
            A 500 is returned only if identities exist but none is marked as default
            (database integrity violation).
        to_addr:
          type: string
          maxLength: 8192
        cc_addr:
          type: string
          maxLength: 8192
        bcc_addr:
          type: string
          maxLength: 8192
        reply_to_addr:
          type: string
          maxLength: 8192
        subject:
          type: string
          maxLength: 998
        body_text:
          type: string
        body_html:
          type: string
        in_reply_to:
          type: string
          description: |
            Surrounding angle brackets are stripped before storage (e.g. `<id@domain>` is
            stored as `id@domain`), consistent with `references` handling.
        references:
          type: array
          items:
            type: string
          description: |
            Threading Reference IDs. Elements may include or omit angle brackets
            (e.g. `<id@domain>` or `id@domain`); the server strips surrounding angle brackets
            before storage. When reading back via `MessageDetail.references`, elements always
            include angle brackets (e.g. `<id@domain>`).
        send_at:
          type: string
          format: date-time
          nullable: true
          description: Stored but not acted upon until the draft is sent.
        source_message_id:
          type: integer
          nullable: true
          description: |
            If present on POST, attachments from this source message are copied server-side into the
            new draft atomically. Used when forwarding a message to pre-populate the draft
            with the original attachments. On PUT (replace), this field is silently ignored —
            no attachments are copied and no error is returned. The referenced message may be
            in any folder, including Drafts; only existence is checked. Returns 400 if the
            referenced message does not exist.

    Filter:
      type: object
      properties:
        id:
          type: integer
        position:
          type: integer
        name:
          type: string
        match_from:
          type: string
        match_to:
          type: string
        match_subject:
          type: string
        action:
          type: string
          enum: [move, trash, mark_read, drop]
        folder_id:
          type: integer
          nullable: true
          description: Required when action is "move".
        stop:
          type: boolean
          description: |
            When true, evaluation halts after this filter matches and no further filters are
            evaluated for that message, regardless of whether earlier matching filters had
            `stop=false`. Stored as INTEGER (0/1) in the database; exposed as boolean in the API.
      required: [id, position, name, match_from, match_to, match_subject, action, stop]

    FilterRequest:
      type: object
      properties:
        position:
          type: integer
          description: Display order position. When omitted on POST, appended after the last existing filter.
        name:
          type: string
          maxLength: 200
        match_from:
          type: string
          maxLength: 1000
        match_to:
          type: string
          maxLength: 1000
        match_subject:
          type: string
          maxLength: 1000
        action:
          type: string
          enum: [move, trash, mark_read, drop]
        folder_id:
          type: integer
          nullable: true
          description: |
            Required when `action` is `move`. Must reference an existing folder. Valid targets
            are Inbox (1), Trash (4), Junk (7), and any user folder (id ≥ 100). Sent (2),
            Drafts (3), Scheduled (5), and Snoozed (6) are rejected with 400 — routing inbound
            mail to those folders conflicts with their dedicated semantics (Drafts is created
            via `/drafts` only; Scheduled/Snoozed are managed by the scheduler; nothing should
            be auto-dropped into Sent).
        stop:
          type: boolean
          default: true
          description: |
            When true, evaluation halts after this filter matches. Defaults to `true` when omitted,
            matching the database default (`stop INTEGER NOT NULL DEFAULT 1`).
      required: [action]

    SpamFilterSettings:
      type: object
      properties:
        enabled:
          type: boolean
        score_header:
          type: string
          minLength: 1
          maxLength: 200
        score_threshold:
          type: number
          minimum: 0
          description: |
            Score threshold (inclusive: messages with score `>= threshold` are spam). Must be
            zero or positive. There is no upper bound. A threshold of `0` is permitted and
            means "match every message whose score header parses as a number" — useful when
            the operator wants to defer to the upstream filter's flag/status entirely.
      required: [enabled, score_header, score_threshold]

    Identity:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        is_default:
          type: boolean
        position:
          type: integer
        signature:
          type: string
          maxLength: 51200
          description: Plain-text signature; empty string means no signature. Maximum 50 KiB.
      required: [id, name, address, is_default, position, signature]

    IdentityRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        is_default:
          type: boolean
        position:
          type: integer
          description: Display order position. When omitted on POST, appended after the last existing identity.
        signature:
          type: string
          maxLength: 51200
      required: [name, address]

    Contact:
      type: object
      properties:
        id:
          type: integer
        address:
          type: string
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, address, name, created_at, updated_at]

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Default:
      description: Default error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  # ── Folders ────────────────────────────────────────────────────────────────

  /folders:
    get:
      summary: List folders
      description: Returns all folders ordered by position.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Folder'
                required: [total, items]
        'default':
          $ref: '#/components/responses/Default'
    post:
      summary: Create folder
      description: |
        Create a user-defined folder. The slug is derived from the name by Unicode NFKD
        normalization, lowercasing, replacing non-alphanumeric runs with hyphens, and trimming
        leading/trailing hyphens. If the slug collides with an existing one, a numeric suffix
        (`-2`, `-3`, …) is appended. Leading/trailing whitespace is trimmed from the name before
        processing. When `position` is omitted, the server sets it to `MAX(existing positions) + 1`,
        placing the new folder at the end of the ordered list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                position:
                  type: integer
                  description: Display order position. When omitted, appended after the last existing folder.
              required: [name]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '409':
          $ref: '#/components/responses/Conflict'
        'default':
          $ref: '#/components/responses/Default'

  /folders/{id}:
    patch:
      summary: Update folder
      description: |
        Update folder name and/or position. Built-in folders (ids 1–7) may only have their
        `position` updated; supplying a `name` for a built-in folder returns
        `400 {"error": "built-in folders cannot be renamed"}`. The entire request is rejected
        with 400 when `name` is supplied for a built-in folder, regardless of whether `position`
        is also present — `position` is not applied in that case.

        **Slug stability:** the `slug` field is immutable for both built-in and user folders.
        Renaming a user folder via this endpoint changes only the display `name`; the slug is
        preserved so bookmarked URLs and stored filter references continue to work.

        **Conflicts:** if the new `name` collides with an existing folder's name, returns 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                position:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        'default':
          $ref: '#/components/responses/Default'
    delete:
      summary: Delete folder
      description: |
        Delete a user-created folder. Messages are moved to Trash first. Returns 400 for all
        built-in folders (ids 1–7). The Trash folder (id 4) is specifically protected because it
        is the cascade target for this operation; deleting it would leave the operation with
        nowhere to move messages.

        When moving messages to Trash, the fields `snoozed_until`, `snooze_folder`, and `send_at`
        are cleared in the same UPDATE to prevent the scheduler from attempting to process messages
        that are now in Trash.

        Messages in the Snoozed folder (id=6) that have `snooze_folder` pointing to the deleted
        folder are not moved — they remain snoozed. The `snooze_folder` column is set to NULL
        via the `ON DELETE SET NULL` foreign key constraint at deletion time. When snooze expires,
        the scheduler uses `COALESCE(snooze_folder, 1)` so the message returns to Inbox.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /folders/reorder:
    patch:
      summary: Reorder folders
      description: |
        Update position values for multiple folders at once. The supplied order becomes the new
        position sequence (0, 1, 2, …).

        The `ids` array must contain **every** existing folder exactly once, including built-in
        folders (ids 1–7); partial reorders are not supported. Duplicate IDs → 400. Unknown IDs
        → 400. Missing IDs → 400 (`{"error": "incomplete reorder; all ids must be supplied"}`).
        An empty `ids` array is also rejected with the same "incomplete reorder" 400, **unless**
        no folders exist at all, in which case the call is a no-op returning `updated: 0`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
              required: [ids]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]
        '400':
          $ref: '#/components/responses/BadRequest'
        'default':
          $ref: '#/components/responses/Default'

  /folders/{folder_id}/messages:
    get:
      summary: List messages in folder
      description: |
        List messages in a folder, ordered by date descending, ties broken by ascending `id` so
        that paging is over a fully determined order. When both `unread` and `flagged`
        query parameters are provided, they are combined with AND semantics (only messages that
        are both unread AND flagged are returned).

        **Accessing drafts:** there is no separate `/drafts` list endpoint. Use
        `GET /folders/3/messages` (folder_id=3 is the Drafts built-in folder) to list drafts.
      parameters:
        - name: folder_id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: unread
          in: query
          schema:
            type: boolean
        - name: flagged
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageSummary'
                required: [total, items]
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'
    delete:
      summary: Delete all messages in folder
      description: |
        Delete all messages in a folder. Returns 400 for Scheduled (id=5), Snoozed (id=6), and Drafts (id=3) folders.

        **Semantics by folder:**
        - **Junk (id=7):** all messages are permanently deleted immediately.
        - **Trash (id=4):** messages already in Trash are permanently deleted (standard — there is nowhere else to go).
        - **All other folders:** messages are moved to Trash (two-step semantics). `moved_to_trash` reflects how many were moved; `permanently_deleted` will be 0.
      parameters:
        - name: folder_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved_to_trash:
                    type: integer
                    description: Number of messages moved to Trash (were not already in Trash).
                  permanently_deleted:
                    type: integer
                    description: Number of messages permanently deleted (were already in Trash).
                required: [moved_to_trash, permanently_deleted]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /folders/{folder_id}/mark-all-read:
    post:
      summary: Mark all messages in folder as read
      description: Atomically marks every message in the folder as read. Returns the count of messages updated.
      parameters:
        - name: folder_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                    description: Number of messages marked as read.
                required: [updated]
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  # ── Messages ───────────────────────────────────────────────────────────────

  /messages/search:
    get:
      summary: Search messages
      description: |
        Full-text search using FTS5 phrase-match. Results are ordered by relevance by default using
        `ORDER BY rank` (SQLite FTS5 BM25 score — lower/more-negative rank means higher relevance).
        No custom column weighting is applied. `sort` selects a date ordering instead.
        Optionally filtered by date range and by sender/recipient address. The FTS5 `unicode61`
        tokenizer is used, so searches are case-insensitive. Search results include a `snippet`
        field (present only in search results, not in `GET /messages/{id}`).

        When `folder_id` is not specified, the search covers all folders **except Junk** (id=7),
        **Drafts** (id=3), and **Scheduled** (id=5). To search within those folders explicitly,
        pass the corresponding `folder_id`.

        Returns 400 with `{"error": "q must contain at least one non-whitespace character"}` when
        `q` is empty (`q=`) or contains only whitespace after trimming. Whitespace trimming uses
        Unicode rules (`strings.TrimSpace`). Match-all is not supported via this endpoint — list a
        folder via `GET /folders/{folder_id}/messages` instead.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: folder_id
          in: query
          schema:
            type: integer
        - name: date_from
          in: query
          description: |
            Inclusive lower bound (RFC 3339 timestamp, e.g. `2025-01-15T00:00:00Z`). Only messages
            with `date >= date_from` are returned. Clients should set this to the start of the desired
            day in their local timezone (e.g. `2025-01-15T00:00:00+02:00`).
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          description: |
            Exclusive upper bound (RFC 3339 timestamp, e.g. `2025-01-16T00:00:00Z`). Only messages
            with `date < date_to` are returned. Clients should set this to the start of the day
            after the desired end day in their local timezone (e.g. `2025-01-16T00:00:00+02:00`).
          schema:
            type: string
            format: date-time
        - name: from_addr
          in: query
          description: |
            Case-insensitive substring match against the message's `From` header (display name
            included, exactly as stored in `from_addr`), narrowing the full-text result set. Uses
            the same matching rule as a filter's `match_from`; `%` and `_` are literals, not
            wildcards. Whitespace-only values are ignored, as is an empty value (`from_addr=`).
          schema:
            type: string
            maxLength: 200
        - name: to_addr
          in: query
          description: |
            Case-insensitive substring match against the message's recipients, narrowing the
            full-text result set. Like a filter's `match_to` it matches the `To` **or** the `Cc`
            header (`to_addr` or `cc_addr`); `%` and `_` are literals, not wildcards.
            Whitespace-only values are ignored, as is an empty value (`to_addr=`).
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          description: |
            Result ordering. `relevance` (the default) is FTS5 `ORDER BY rank`; `date_desc` orders
            newest first and `date_asc` oldest first, both on the message's `date` — the same field
            the Date column shows, not the arrival time. Ties on `date` are broken by ascending
            `id` in both directions, so paging a date sort never repeats or skips a message.
          schema:
            type: string
            enum: [relevance, date_asc, date_desc]
            default: relevance
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/MessageSummary'
                        - type: object
                          properties:
                            snippet:
                              type: string
                              description: |
                                A short excerpt of the matching text from `body_text`, centered on
                                the first matching term. Matched terms are surrounded by `**` markers
                                (e.g. `…the **keyword** in…`), with `…` at truncated boundaries.
                          required: [snippet]
                required: [total, items]
        '400':
          $ref: '#/components/responses/BadRequest'
        'default':
          $ref: '#/components/responses/Default'

  /messages/send:
    post:
      summary: Send or schedule a message
      description: |
        Compose and send a new message, or schedule it for future delivery. See
        `SendRequest.send_at` for the immediate-vs-scheduled threshold (`send_at > now + 60s`
        schedules; otherwise immediate).

        Returns `400 {"error": "no identity configured; create one in Settings → Identities first"}`
        when no identities exist.

        If `identity_id` is supplied but does not match any existing identity, returns
        `400 {"error": "identity not found"}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '201':
          description: Sent immediately
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID of the newly created message in the Sent folder.
                required: [id]
        '202':
          description: Scheduled for future delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID of the newly created message in the Scheduled folder.
                  send_at:
                    type: string
                    format: date-time
                required: [id, send_at]
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        'default':
          $ref: '#/components/responses/Default'

  /messages/send-with-attachments:
    post:
      summary: Send or schedule a message with attachments
      description: |
        Same as /messages/send but uses multipart/form-data. JSON fields in a "message" part;
        each attachment is a separate file part.

        Returns `400 {"error": "no identity configured; create one in Settings → Identities first"}`
        when no identities exist.

        If `identity_id` is supplied but does not match any existing identity, returns
        `400 {"error": "identity not found"}`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                message:
                  $ref: '#/components/schemas/SendRequest'
                attachments:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Sent immediately
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID of the newly created message in the Sent folder.
                required: [id]
        '202':
          description: Scheduled for future delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID of the newly created message in the Scheduled folder.
                  send_at:
                    type: string
                    format: date-time
                required: [id, send_at]
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        'default':
          $ref: '#/components/responses/Default'

  /messages/{id}:
    get:
      summary: Get message details
      description: Get full message including body and attachment list. Does not alter read state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'
    patch:
      summary: Update message metadata
      description: |
        Partial update of folder_id, read, or flagged. Moving to/from Scheduled (5), Snoozed (6),
        or Drafts (3) folders is rejected with 400. Drafts is forbidden because drafts are created
        and managed only via the `/drafts` endpoints. Use the dedicated snooze and scheduled
        endpoints for Snoozed/Scheduled.

        When `folder_id` is set to 4 (Trash) or 7 (Junk), `snoozed_until`, `snooze_folder`, and
        `send_at` are cleared in the same UPDATE to prevent the background scheduler from acting on
        a message that is now in Trash or Junk. `send_failure_count` and `send_error` are preserved;
        the UI must suppress the send-failure badge when `folder_id = 4`.

        An empty body (`{}`) is valid and returns 200 as a no-op.

        **Moving to Junk via PATCH:** Setting `folder_id: 7` moves the message to Junk but does **not** automatically mark it as read. To get the full "mark as junk" semantics (move to Junk + mark read), use `POST /messages/{id}/mark-junk` instead. API clients that use PATCH to move to `folder_id: 7` must include `"read": true` explicitly if they want the message marked as read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_id:
                  type: integer
                read:
                  type: boolean
                flagged:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'
    delete:
      summary: Delete message
      description: |
        If in Trash (id=4) or Junk (id=7), permanently deletes immediately. Otherwise, moves to Trash.
        Messages currently in Scheduled (5), Snoozed (6), or Drafts (3) may not be deleted via
        this endpoint — they are rejected with 400. Use the dedicated endpoints to cancel
        a schedule (`DELETE /scheduled/{id}`), cancel a snooze (`DELETE /messages/{id}/snooze`),
        or delete a draft (`DELETE /drafts/{id}`).
        When moving to Trash, `snoozed_until`, `snooze_folder`, and `send_at` are cleared in the
        same UPDATE to prevent the background scheduler from acting on a message that is now in Trash.
        `send_failure_count` and `send_error` are preserved in Trash; the UI must suppress the
        send-failure badge when `folder_id = 4`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /messages:
    patch:
      summary: Bulk update messages
      description: |
        Apply the same read/flagged patch to multiple messages.
        Returns 404 if any of the provided IDs does not exist; no changes are made in that case.
        Returns 400 if more than 1000 IDs are supplied (the `maxItems: 1000` constraint on the `ids`
        array is the enforced limit); no changes are made in that case.
        Returns 400 if `ids` is an empty array (`{"error": "ids must contain at least one id"}`);
        no SQL is issued.
        The `updated` count equals the number of rows actually modified (no-op updates where the
        new value equals the existing value are not counted).
        When neither `read` nor `flagged` is supplied, all specified messages are considered already
        matching (no SQL UPDATE is issued), `updated` is 0, and 200 is returned. This mirrors the
        single-message no-op behaviour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  minItems: 1
                  maxItems: 1000
                read:
                  type: boolean
                flagged:
                  type: boolean
              required: [ids]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'
    delete:
      summary: Bulk delete messages
      description: |
        Same semantics as single delete: messages in Trash (id=4) or Junk (id=7) are permanently
        deleted immediately; all other messages are moved to Trash. Returns `moved_to_trash` and
        `permanently_deleted` counts consistent with `DELETE /folders/{folder_id}/messages`.
        Messages currently in Scheduled (5), Snoozed (6), or Drafts (3) may not be deleted via
        this endpoint — they are rejected with 400 (the entire request is rejected; no changes are
        made). Use the dedicated endpoints to cancel a schedule, cancel a snooze, or delete a draft.
        When moving messages to Trash, `snoozed_until`, `snooze_folder`, and `send_at` are cleared
        in the same UPDATE to prevent the background scheduler from acting on messages now in Trash.
        `send_failure_count` and `send_error` are preserved in Trash; the UI must suppress the
        send-failure badge when `folder_id = 4`.
        Returns 404 if any of the provided IDs does not exist; no changes are made in that case.
        Returns 400 if more than 1000 IDs are supplied (the `maxItems: 1000` constraint on the `ids`
        array is the enforced limit); no changes are made in that case.
        Returns 400 if `ids` is an empty array (`{"error": "ids must contain at least one id"}`);
        no SQL is issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  minItems: 1
                  maxItems: 1000
              required: [ids]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved_to_trash:
                    type: integer
                    description: Number of messages moved to Trash (were not already in Trash).
                  permanently_deleted:
                    type: integer
                    description: Number of messages permanently deleted (were already in Trash).
                required: [moved_to_trash, permanently_deleted]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /messages/move:
    post:
      summary: Bulk move messages to a folder
      description: |
        Move multiple messages to the specified folder. The destination folder must not be
        Scheduled (5), Snoozed (6), or Drafts (3) — these are rejected with 400.
        Messages currently in Scheduled (5), Snoozed (6), or Drafts (3) may not be moved via
        this endpoint — they are rejected with 400. Use the dedicated endpoints to cancel
        a schedule, cancel a snooze, or delete a draft.
        Returns 404 if any of the provided IDs does not exist; no changes are made in that case.
        Returns 400 if more than 1000 IDs are supplied (the `maxItems: 1000` constraint on the `ids`
        array is the enforced limit); no changes are made in that case.
        Returns 400 if `ids` is an empty array (`{"error": "ids must contain at least one id"}`);
        no SQL is issued.
        When `folder_id` is set to 4 (Trash), `snoozed_until`, `snooze_folder`, and `send_at` are
        cleared in the same UPDATE to prevent the background scheduler from acting on messages
        now in Trash. `send_failure_count` and `send_error` are preserved; the UI must suppress
        the send-failure badge when `folder_id = 4`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  minItems: 1
                  maxItems: 1000
                folder_id:
                  type: integer
              required: [ids, folder_id]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /messages/{id}/raw:
    get:
      summary: Download raw message
      description: |
        Download the original RFC 5322 message file. The filename is `<id>.eml` (numeric, always
        ASCII-safe) so the response never needs RFC 8187 encoding and there is no header-injection
        vector via subject-derived filenames.

        When the message is a draft (the `raw` column is NULL), returns `200 OK` with
        `Content-Type: application/json` and body `{}` (empty JSON object) instead of a
        `message/rfc822` response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            OK. For non-draft messages: RFC 5322 content as a file download. For drafts: empty
            JSON object `{}`.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="42.eml"'
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /messages/{id}/headers:
    get:
      summary: Get message headers
      description: |
        Returns the raw RFC 5322 header block (everything before the first blank line).
        Returns 404 for drafts, which have no stored raw message.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Raw RFC 5322 headers as plain text.
          content:
            text/plain:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /messages/{id}/body:
    get:
      summary: Get message HTML body
      description: |
        Returns the sanitised HTML body as a standalone HTML document. The response carries
        its own `Content-Security-Policy` header independent of the parent page's CSP, making
        it suitable for loading in a sandboxed `<iframe src="…">`. Without `?external=1` only
        `data:` URIs (resolved inline attachments) are permitted; with `?external=1` HTTPS
        images are also allowed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: external
          in: query
          required: false
          description: Set to `1` to allow loading of external HTTPS images.
          schema:
            type: string
      responses:
        '200':
          description: HTML document
          headers:
            Content-Security-Policy:
              schema:
                type: string
            X-Frame-Options:
              schema:
                type: string
            Referrer-Policy:
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /messages/{id}/thread:
    get:
      summary: Get thread
      description: |
        Returns all messages in the same thread, ordered by date ascending, ties broken by ascending `id`.

        **Thread membership algorithm (applied in order):**
        1. **Header-based (primary):** Build a directed graph where message A links to message B if
           B's `Message-ID` appears in A's `In-Reply-To` or A's `References` list. Take the transitive
           closure of this graph to find all messages connected to the requested message. The requested
           message itself is always included.
        2. **Subject-based fallback:** If header-based grouping yields only the single requested message
           (no links found to any other stored message), group by normalised subject: strip leading
           reply/forward prefixes (any combination, case-insensitive, applied **repeatedly** until no
           further match) — `Re:`, `Fwd:`, `Fw:`, `AW:`, `WG:`, `RES:`, `ENC:`, `VS:`, `SV:` — and
           compare the remainder case-insensitively. The full regex is defined in REQUIREMENTS.md
           → Compose → Subject prefix stripping.

        The endpoint includes messages from all folders (Inbox, Sent, Trash, Snoozed, etc.) so the
        full conversation is always visible.

        **Cap:** At most 1000 messages are returned. If the thread exceeds this limit, the 1000
        messages with the earliest `date` are returned and `truncated` is set to `true`. The UI
        shows a "thread too long" indicator when `truncated` is true.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Number of messages returned (≤ 1000).
                  truncated:
                    type: boolean
                    description: True when the thread exceeds 1000 messages and results were capped.
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageSummary'
                required: [total, truncated, items]
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /messages/{id}/snooze:
    post:
      summary: Snooze a message
      description: |
        Temporarily hide a message until a future time. The message must be in Inbox, a user
        folder, **or already in Snoozed**. System folders (Drafts, Sent, Trash, Junk, Scheduled)
        are not allowed — each has its own specific semantics that would conflict with snooze
        behaviour. Drafts, Sent, Trash, Junk, and Scheduled folders are not valid snooze sources. `until` must be a future timestamp at least 1 minute ahead of the current
        server time. On expiry, the message is returned to the folder it was in at the time of
        the **first** snooze (recorded in `snooze_folder`); if that folder has since been
        deleted, Inbox is used.

        **Re-snoozing:** if the message is already in Snoozed, the request updates `snoozed_until`
        and returns 200 with `folder_id=6`; `snooze_folder` is not changed (so the original return
        folder is preserved across reschedules). Concurrent snooze requests on the same message
        are permitted — whichever update commits last wins for `snoozed_until`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                until:
                  type: string
                  format: date-time
              required: [until]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  folder_id:
                    type: integer
                    description: The folder the message was moved to (id=6, Snoozed).
                  snoozed_until:
                    type: string
                    format: date-time
                  snooze_folder_id:
                    type: integer
                    nullable: true
                    description: |
                      The folder the message will return to on expiry (the folder it was in before
                      snoozing). May be null if that folder was deleted after the snooze was created;
                      in that case the scheduler falls back to Inbox (id=1) via COALESCE.
                required: [id, folder_id, snoozed_until, snooze_folder_id]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'
    delete:
      summary: Cancel snooze
      description: |
        Cancel a snooze early, returning the message to its original folder immediately.
        Returns 400 when the message is not currently in the Snoozed folder (id=6); the check
        is based on the current `folder_id`, not on the stored `snoozed_until` timestamp.
        On success, `snoozed_until` and `snooze_folder` are cleared and the message is marked
        unread (`read = 0`) — matching the behaviour of natural snooze expiry by the scheduler.

        If `snooze_folder` is null (because the original folder was deleted after the snooze was
        set, or because it was never recorded), the message is returned to Inbox (id=1) via the
        same `COALESCE(snooze_folder, 1)` fallback used by the scheduler. The `folder_id` in the
        response reflects the actual folder the message was moved to.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  folder_id:
                    type: integer
                required: [id, folder_id]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /messages/{id}/mark-junk:
    post:
      summary: Mark message as junk
      description: |
        Moves the message to the Junk folder (id=7) and marks it as read. Returns 400 if the
        message is currently in the Junk folder (id=7), the Drafts folder (id=3), the Scheduled
        folder (id=5), or the Snoozed folder (id=6). Drafts are managed exclusively via the
        `/drafts` endpoints. The schedule or snooze must be cancelled before marking as junk.
        These checks are based on the current folder_id, not historical state. Marking a
        message in the Trash (id=4) or Sent (id=2) folder as junk is **permitted** — no 400 is
        returned for those source folders.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  folder_id:
                    type: integer
                required: [id, folder_id]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /messages/{id}/mark-not-junk:
    post:
      summary: Mark message as not junk
      description: Moves the message from Junk to Inbox and marks it as unread. Returns 400 if not in Junk.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  folder_id:
                    type: integer
                required: [id, folder_id]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  # ── Attachments ────────────────────────────────────────────────────────────

  /attachments/{id}:
    get:
      summary: Download attachment
      description: |
        Download attachment data. Always served as `application/octet-stream` regardless of the
        stored `content_type` (which originates from the untrusted sender). The
        `Content-Disposition: attachment; filename="..."` header uses the stored filename with
        CR, LF, and NUL characters stripped to prevent header injection.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="report.pdf"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  # ── Scheduled ──────────────────────────────────────────────────────────────

  /scheduled/{id}:
    patch:
      summary: Reschedule a scheduled message
      description: |
        Update the `send_at` timestamp of a message that is currently in the Scheduled folder.
        The new `send_at` must be more than 60 seconds in the future (same threshold as initial
        scheduling). Returns 404 when the message does not exist or is no longer in the Scheduled
        folder (e.g. the scheduler already sent or moved it).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                send_at:
                  type: string
                  format: date-time
              required: [send_at]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  folder_id:
                    type: integer
                  send_at:
                    type: string
                    format: date-time
                required: [id, folder_id, send_at]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'
    delete:
      summary: Cancel scheduled message
      description: |
        Cancel a scheduled message and move it to Drafts. Implemented as a single conditional
        UPDATE that requires `folder_id = 5` (Scheduled) AND `send_at IS NOT NULL`.

        On success, `send_failure_count` is reset to 0 and `send_error` is cleared (set to NULL)
        in the same UPDATE, so the message does not carry a failure badge when it reappears in the
        Drafts list.

        - 200 when the cancellation moved the message back to Drafts.
        - **404** when no such row exists, including the race where the scheduler has already
          moved the message out of Scheduled (sent → Sent, or exhausted retries → Drafts) before
          this request committed. The 404 indicates "no longer cancellable" rather than
          "never existed".
        - **400** is reserved for input-validation failures (e.g. non-integer `id` rejected by
          the path parameter type); it does not indicate a race.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  folder_id:
                    type: integer
                required: [id, folder_id]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /scheduled/{id}/send:
    post:
      summary: Send a scheduled message immediately
      description: |
        Send a scheduled message right now, bypassing the deferred send time.
        The message must be in the Scheduled folder (folder_id=5) with a non-NULL `send_at`.
        On success the message is moved to Sent (folder_id=2).
        On sendmail failure the message is moved to Drafts (folder_id=3) so the user can
        reschedule or send again; the response body contains the sendmail error.
        Returns 404 when the message does not exist or is no longer in the Scheduled folder.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  folder_id:
                    type: integer
                required: [id, folder_id]
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  # ── Drafts ─────────────────────────────────────────────────────────────────

  /drafts:
    post:
      summary: Save new draft
      description: |
        Save a new draft. Nothing is sent. `send_at`, if supplied, is stored but not acted upon.
        If `source_message_id` is supplied, all attachments from that message are copied into the
        new draft atomically (used when forwarding a message). Returns 400 if `source_message_id`
        references a message that does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
                required: [id, updated_at]
        '400':
          $ref: '#/components/responses/BadRequest'
        'default':
          $ref: '#/components/responses/Default'

  /drafts-with-attachments:
    post:
      summary: Save new draft with attachments
      description: |
        Same as POST /drafts but uses multipart/form-data. When both `source_message_id`
        (in the `DraftRequest` JSON part) and file upload parts are supplied simultaneously,
        both are applied: the source message's attachments are copied server-side **and** the
        uploaded file parts are stored. Source-message attachments are stored first (in their
        original order), followed by the newly uploaded file parts.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                message:
                  $ref: '#/components/schemas/DraftRequest'
                attachments:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
                required: [id, updated_at]
        '400':
          $ref: '#/components/responses/BadRequest'
        'default':
          $ref: '#/components/responses/Default'

  /drafts/{id}:
    put:
      summary: Replace draft content
      description: |
        Replace an existing draft entirely. All content fields are replaced; if `send_at` is absent
        or null, any previously stored value is cleared. `source_message_id` is ignored on PUT.
        **Attachments are not modified by this endpoint** — existing attachment rows remain unchanged.
        Use `DELETE /drafts/{id}/attachments/{attachment_id}` to remove individual attachments, or
        `PUT /drafts-with-attachments/{id}` to replace all attachments wholesale.

        Returns 404 if the message does not exist or if its `folder_id` is not 3 (Drafts).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
                required: [id, updated_at]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'
    delete:
      summary: Delete draft
      description: |
        Permanently delete a draft (no Trash step).
        Returns 404 if the message does not exist or if its `folder_id` is not 3 (Drafts).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /drafts/{id}/send:
    post:
      summary: Send or schedule a draft
      description: |
        Send or schedule the draft identified by `{id}`. The server reads all draft fields and
        attachments from the database — no request body is needed and no re-upload is required.

        - If `send_at` is null, in the past, equal to now, or within the next 60 seconds, the draft
          is sent immediately: the MIME message is constructed (including all stored attachments),
          piped to `sendmail`, and on success the draft is deleted and the sent message is stored
          in the Sent folder (201).
        - If `send_at > now + 60 seconds`, a new message is created in the Scheduled folder and
          the draft is deleted (202). The scheduler will send it at the specified time.

        On sendmail failure the draft is preserved unchanged and 500 is returned. Returns 400 if
        none of `to_addr`, `cc_addr`, `bcc_addr` is non-empty. Returns
        `400 {"error": "no identity configured; create one in Settings → Identities first"}`
        when no identities exist.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Sent immediately
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID of the newly created message in the Sent folder.
                required: [id]
        '202':
          description: Scheduled for future delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID of the newly created message in the Scheduled folder.
                  send_at:
                    type: string
                    format: date-time
                required: [id, send_at]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Returned when the draft does not exist, or when it is no longer in the Drafts folder (folder_id ≠ 3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        'default':
          $ref: '#/components/responses/Default'

  /drafts/{id}/attachments/{attachment_id}:
    delete:
      summary: Remove a single attachment from a draft
      description: |
        Delete one attachment from an existing draft without affecting the other attachments
        or any other draft fields. Returns 404 if the draft or attachment does not exist, or
        400 if the attachment does not belong to the specified draft.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attachment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Attachment deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /drafts-with-attachments/{id}:
    put:
      summary: Replace draft content with attachments
      description: |
        Same as PUT /drafts/{id} but uses multipart/form-data. Existing attachments are replaced
        wholesale. If no file parts are present, all existing attachments for the draft are
        deleted — an empty file-parts list is a valid way to clear all attachments.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                message:
                  $ref: '#/components/schemas/DraftRequest'
                attachments:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
                required: [id, updated_at]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  # ── Filters ────────────────────────────────────────────────────────────────

  /filters:
    get:
      summary: List filters
      description: Returns all filters ordered by position.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Filter'
                required: [total, items]
        'default':
          $ref: '#/components/responses/Default'
    post:
      summary: Create filter
      description: |
        Create a filter. At least one of `match_from`, `match_to`, `match_subject` must be
        non-empty. A field is considered non-empty if it is not `null`, not `""`, and not a
        whitespace-only string. When this condition is not met, returns 400 with
        `{"error": "at least one of match_from, match_to, match_subject must be non-empty"}`.
        When `action` is `move`, `folder_id` is required; omitting it returns 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '400':
          $ref: '#/components/responses/BadRequest'
        'default':
          $ref: '#/components/responses/Default'

  /filters/{id}:
    put:
      summary: Replace filter
      description: |
        Replace a filter entirely. Validation is identical to POST: at least one match field must
        be non-empty, and `folder_id` is required when `action` is `move`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'
    delete:
      summary: Delete filter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /filters/reorder:
    patch:
      summary: Reorder filters
      description: |
        Update position values for multiple filters at once. The supplied order becomes the new
        position sequence (0, 1, 2, …).

        The `ids` array must contain **every** existing filter exactly once; partial reorders are
        not supported. Duplicate IDs → 400. Unknown IDs → 400. Missing IDs → 400
        (`{"error": "incomplete reorder; all ids must be supplied"}`). An empty `ids` array is
        also rejected with the same "incomplete reorder" 400, **unless** no filters exist at all,
        in which case the call is a no-op returning `updated: 0`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
              required: [ids]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]
        '400':
          $ref: '#/components/responses/BadRequest'
        'default':
          $ref: '#/components/responses/Default'

  # ── Spam Filter ────────────────────────────────────────────────────────────

  /spam-filter:
    get:
      summary: Get spam filter settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpamFilterSettings'
        'default':
          $ref: '#/components/responses/Default'
    put:
      summary: Replace spam filter settings
      description: |
        Replace spam filter settings entirely. `score_threshold` must be ≥ 0 (no upper bound);
        a threshold of `0` is allowed and is treated as "match any message with a parseable
        score". `score_header` must be non-empty after trimming.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpamFilterSettings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpamFilterSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        'default':
          $ref: '#/components/responses/Default'

  # ── Identities ─────────────────────────────────────────────────────────────

  /identities:
    get:
      summary: List identities
      description: Returns all identities ordered by position, then id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Identity'
                required: [total, items]
        'default':
          $ref: '#/components/responses/Default'
    post:
      summary: Create identity
      description: |
        Create an identity. `address` must be a valid RFC 5322 addr-spec. The `address` is stored
        in Unicode-simple-casefolded form before the uniqueness check.
        If `is_default` is true, all other identities are set to is_default=false.
        When `is_default` is absent or false and at least one identity already exists, the new
        identity is created as non-default and the existing default identity is unchanged.
        The first identity created (when no identities exist) is automatically marked as default
        regardless of the `is_default` field value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        'default':
          $ref: '#/components/responses/Default'

  /identities/{id}:
    put:
      summary: Replace identity
      description: |
        Replace an identity entirely. Same validation as POST. The `address` is stored in
        Unicode-simple-casefolded form before the uniqueness check. When the identity's `address`
        changes, all drafts referencing this identity have their `from_addr` updated to the
        new address in the same transaction, preventing stale sender addresses in the Drafts list.
        If `is_default` is true, this identity becomes the default and all others are set to
        is_default=false. If `is_default` is absent or false, the default status of this identity
        is left unchanged (i.e. the field only has effect when explicitly set to true).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        'default':
          $ref: '#/components/responses/Default'
    delete:
      summary: Delete identity
      description: Delete an identity. Returns 400 if it is the only identity. If the default is deleted, the next identity by position/id is promoted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/Default'

  /identities/reorder:
    patch:
      summary: Reorder identities
      description: |
        Update position values for multiple identities at once. The supplied order becomes the new
        position sequence (0, 1, 2, …).

        The `ids` array must contain **every** existing identity exactly once; partial reorders are
        not supported. Duplicate IDs → 400. Unknown IDs → 400. Missing IDs → 400
        (`{"error": "incomplete reorder; all ids must be supplied"}`). An empty `ids` array is
        also rejected with the same "incomplete reorder" 400, **unless** no identities exist at
        all, in which case the call is a no-op returning `updated: 0`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
              required: [ids]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]
        '400':
          $ref: '#/components/responses/BadRequest'
        'default':
          $ref: '#/components/responses/Default'

  # ── Contacts ───────────────────────────────────────────────────────────────

  /contacts:
    get:
      summary: List contacts
      description: |
        List contacts ordered by name (empty names last), then address, then `id`. Supports autocomplete
        filtering.
        When used for address-field autocomplete dropdowns, clients should send `limit=10`. If `total`
        exceeds the requested limit, the UI should show a "type more to narrow" hint rather than paginating.
        The Contact schema has no flag distinguishing manually set names from auto-populated ones;
        this distinction is enforced server-side and not observable via the API.
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 500
          description: Case-insensitive substring filter on name or address.
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                required: [total, items]
        'default':
          $ref: '#/components/responses/Default'
    post:
      summary: Create contact
      description: |
        Create a contact. `address` must be a valid RFC 5322 addr-spec. The `address` is stored
        in Unicode-simple-casefolded form before the uniqueness check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  maxLength: 254
                name:
                  type: string
                  maxLength: 200
              required: [address]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        'default':
          $ref: '#/components/responses/Default'

  /contacts/{id}:
    put:
      summary: Replace contact
      description: |
        Replace a contact entirely. **PUT replacement semantics:** any field omitted from the
        request body is cleared — omitting `name` sets it to empty string. The `address` is
        stored in Unicode-simple-casefolded form before the uniqueness check. Returns 409 if
        the new address conflicts with a different existing contact.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  maxLength: 254
                name:
                  type: string
                  maxLength: 200
              required: [address]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        'default':
          $ref: '#/components/responses/Default'
    delete:
      summary: Delete contact
      parameters:
        - name: id
