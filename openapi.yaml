openapi: 3.0.3
info:
  title: mymail API
  description: REST API for mymail — a self-hosted personal email client.
  version: 1.0.0

servers:
  - url: /api/v1

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Folder:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        position:
          type: integer
        unread_count:
          type: integer
      required: [id, name, slug, position, unread_count]

    MessageSummary:
      type: object
      properties:
        id:
          type: integer
        folder_id:
          type: integer
        message_id:
          type: string
          nullable: true
        from_addr:
          type: string
        to_addr:
          type: string
        subject:
          type: string
        date:
          type: string
          format: date-time
        read:
          type: boolean
        flagged:
          type: boolean
        has_attachments:
          type: boolean
        send_failed:
          type: boolean
          description: |
            True when the message has at least one send attempt failure (send_failure_count > 0).
            The UI uses this to show a failure badge without fetching the full message detail:
            - In the Scheduled folder: show a yellow warning badge (send is being retried).
            - In the Drafts folder: show a red error badge (message was moved from Scheduled after exhausting all retries).
        created_at:
          type: string
          format: date-time
      required: [id, folder_id, from_addr, to_addr, subject, date, read, flagged, has_attachments, send_failed, created_at]

    AttachmentMeta:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
      required: [id, filename, content_type, size]

    MessageDetail:
      type: object
      properties:
        id:
          type: integer
        folder_id:
          type: integer
        message_id:
          type: string
          nullable: true
        in_reply_to:
          type: string
          nullable: true
        references:
          type: array
          items:
            type: string
          description: Parsed References header. Empty array when the header is absent or empty.
        from_addr:
          type: string
        to_addr:
          type: string
        cc_addr:
          type: string
        bcc_addr:
          type: string
        reply_to_addr:
          type: string
        subject:
          type: string
        date:
          type: string
          format: date-time
        body_text:
          type: string
        body_html:
          type: string
        has_external_images:
          type: boolean
          description: |
            True when the message body contains external image URLs (img src with http or https scheme).
            The sanitiser blocks these by default; when true, the UI may offer the user a
            "Load external images" action to re-render the body in a relaxed-CSP iframe.
        send_failed:
          type: boolean
          description: |
            True when the message has at least one send attempt failure (send_failure_count > 0).
            The UI uses folder_id context to distinguish the two meaningful states:
            - In the Scheduled folder: show a yellow warning badge (send is being retried).
            - In the Drafts folder: show a red error badge (message was moved from Scheduled after exhausting all retries).
        read:
          type: boolean
        flagged:
          type: boolean
        send_at:
          type: string
          format: date-time
          nullable: true
          description: Non-null only for messages in the Scheduled folder. The time at which the message will be (or was scheduled to be) sent.
        send_error:
          type: string
          nullable: true
          description: Non-null when the message has at least one failed send attempt. Contains the last sendmail stderr output (max 4 KB).
        snoozed_until:
          type: string
          format: date-time
          nullable: true
          description: Non-null when the message is in the Snoozed folder. Displayed in the detail pane so the user can see when it will reappear.
        snooze_folder_id:
          type: integer
          nullable: true
          description: |
            The folder the message will return to when the snooze expires (corresponds to the
            `snooze_folder` database column). May be null even when snoozed_until is non-null;
            when null, the scheduler falls back to Inbox (id=1) via COALESCE.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentMeta'
      required: [id, folder_id, from_addr, to_addr, cc_addr, bcc_addr, reply_to_addr, subject, date, body_text, body_html, has_external_images, send_failed, read, flagged, created_at, updated_at, attachments]

    SendRequest:
      type: object
      properties:
        identity_id:
          type: integer
          description: If absent, the default identity is used.
        to_addr:
          type: string
        cc_addr:
          type: string
        bcc_addr:
          type: string
        reply_to_addr:
          type: string
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        in_reply_to:
          type: string
        references:
          type: array
          items:
            type: string
        send_at:
          type: string
          format: date-time
          nullable: true
          description: If present and in the future (≥1 min), schedule instead of sending immediately.
      required: [to_addr]

    DraftRequest:
      type: object
      description: |
        Request body for creating or replacing a draft. All fields are optional so that
        drafts can be saved before all fields have been filled in by the user.
      properties:
        identity_id:
          type: integer
          description: If absent, the default identity is used.
        to_addr:
          type: string
        cc_addr:
          type: string
        bcc_addr:
          type: string
        reply_to_addr:
          type: string
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        in_reply_to:
          type: string
        references:
          type: array
          items:
            type: string
        send_at:
          type: string
          format: date-time
          nullable: true
          description: Stored but not acted upon until the draft is sent.
        source_message_id:
          type: integer
          nullable: true
          description: |
            If present, attachments from this source message are copied server-side into the
            new draft atomically. Used when forwarding a message to pre-populate the draft
            with the original attachments. Only valid on POST (create); ignored on PUT (replace).

    Filter:
      type: object
      properties:
        id:
          type: integer
        position:
          type: integer
        name:
          type: string
        match_from:
          type: string
        match_to:
          type: string
        match_subject:
          type: string
        action:
          type: string
          enum: [move, trash, mark_read, drop]
        folder_id:
          type: integer
          nullable: true
          description: Required when action is "move".
        stop:
          type: boolean
          description: |
            When true, stop evaluating subsequent filters after this one matches. Stored as
            INTEGER (0/1) in the database; exposed as boolean in the API (true = stop, false = continue).
      required: [id, position, name, match_from, match_to, match_subject, action, stop]

    FilterRequest:
      type: object
      properties:
        position:
          type: integer
        name:
          type: string
        match_from:
          type: string
          maxLength: 1000
        match_to:
          type: string
          maxLength: 1000
        match_subject:
          type: string
          maxLength: 1000
        action:
          type: string
          enum: [move, trash, mark_read, drop]
        folder_id:
          type: integer
          nullable: true
        stop:
          type: boolean
      required: [action]

    SpamFilterSettings:
      type: object
      properties:
        enabled:
          type: boolean
        score_header:
          type: string
          maxLength: 200
        score_threshold:
          type: number
      required: [enabled, score_header, score_threshold]

    Identity:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        is_default:
          type: boolean
        position:
          type: integer
        signature:
          type: string
          maxLength: 51200
          description: Plain-text signature; empty string means no signature. Maximum 50 KiB.
      required: [id, name, address, is_default, position, signature]

    IdentityRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        is_default:
          type: boolean
        position:
          type: integer
        signature:
          type: string
          maxLength: 51200
      required: [name, address]

    Contact:
      type: object
      properties:
        id:
          type: integer
        address:
          type: string
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, address, name, created_at, updated_at]

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  # ── Folders ────────────────────────────────────────────────────────────────

  /folders:
    get:
      summary: List folders
      description: Returns all non-hidden folders ordered by position.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Folder'
    post:
      summary: Create folder
      description: Create a user-defined folder. The slug is derived from the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                position:
                  type: integer
              required: [name]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '409':
          $ref: '#/components/responses/Conflict'

  /folders/{id}:
    patch:
      summary: Update folder
      description: Update folder name and/or position. Built-in folders (ids 1–7) may only have their position updated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                position:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete folder
      description: |
        Delete a user-created folder. Messages are moved to Trash first. Returns 400 for all
        built-in folders (ids 1–7). The Trash folder (id 4) is specifically protected because it
        is the cascade target for this operation; deleting it would leave the operation with
        nowhere to move messages.

        When moving messages to Trash, the fields `snoozed_until`, `snooze_folder`, and `send_at`
        are cleared in the same UPDATE to prevent the scheduler from attempting to process messages
        that are now in Trash.

        Messages in the Snoozed folder (id=6) that have `snooze_folder` pointing to the deleted
        folder are not moved — they remain snoozed and will return to Inbox via the COALESCE
        fallback when their snooze expires.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /folders/reorder:
    patch:
      summary: Reorder folders
      description: Update position values for multiple folders at once. The supplied order becomes the new position sequence (0, 1, 2, …).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
              required: [ids]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]

  /folders/{folder_id}/messages:
    get:
      summary: List messages in folder
      description: |
        List messages in a folder, ordered by date descending. When both `unread` and `flagged`
        query parameters are provided, they are combined with AND semantics (only messages that
        are both unread AND flagged are returned).
      parameters:
        - name: folder_id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: unread
          in: query
          schema:
            type: boolean
        - name: flagged
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageSummary'
                required: [total, messages]
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete all messages in folder
      description: |
        Delete all messages in a folder using two-step semantics: messages not in Trash are moved
        to Trash; messages already in Trash are permanently deleted. Returns 400 for Scheduled (id=5), Snoozed (id=6), and Drafts (id=3) folders.
      parameters:
        - name: folder_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved_to_trash:
                    type: integer
                    description: Number of messages moved to Trash (were not already in Trash).
                  permanently_deleted:
                    type: integer
                    description: Number of messages permanently deleted (were already in Trash).
                required: [moved_to_trash, permanently_deleted]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /folders/{folder_id}/mark-all-read:
    post:
      summary: Mark all messages in folder as read
      description: Atomically marks every message in the folder as read. Returns the count of messages updated.
      parameters:
        - name: folder_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                    description: Number of messages marked as read.
                required: [updated]
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Messages ───────────────────────────────────────────────────────────────

  /messages/search:
    get:
      summary: Search messages
      description: Full-text search across all folders using FTS5 syntax. Results ordered by relevance. Optionally filtered by date range.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 500
        - name: folder_id
          in: query
          schema:
            type: integer
        - name: date_from
          in: query
          description: |
            Inclusive lower bound (RFC 3339 timestamp, e.g. `2025-01-15T00:00:00Z`). Only messages
            with `date >= date_from` are returned. Clients should set this to the start of the desired
            day in their local timezone (e.g. `2025-01-15T00:00:00+02:00`).
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          description: |
            Exclusive upper bound (RFC 3339 timestamp, e.g. `2025-01-16T00:00:00Z`). Only messages
            with `date < date_to` are returned. Clients should set this to the start of the day
            after the desired end day in their local timezone (e.g. `2025-01-16T00:00:00+02:00`).
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  messages:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/MessageSummary'
                        - type: object
                          properties:
                            snippet:
                              type: string
                              description: |
                                A short excerpt (up to 200 characters) of the matching text from
                                `body_text`, generated by the SQLite FTS5 `snippet()` function.
                                Matched terms are surrounded by `**` markers (e.g. `…the **keyword** in…`).
                          required: [snippet]
                required: [total, messages]

  /messages/send:
    post:
      summary: Send or schedule a message
      description: |
        Compose and send a new message, or schedule it for future delivery.
        If `send_at` is absent or null, the message is sent immediately (response 201).
        If `send_at` is a future timestamp (≥1 min), the message is scheduled (response 202).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '201':
          description: Sent immediately
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                required: [id]
        '202':
          description: Scheduled for future delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  send_at:
                    type: string
                    format: date-time
                required: [id, send_at]
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/send-with-attachments:
    post:
      summary: Send or schedule a message with attachments
      description: Same as /messages/send but uses multipart/form-data. JSON fields in a "message" part; each attachment is a separate file part.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                message:
                  $ref: '#/components/schemas/SendRequest'
                attachments:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Sent immediately
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                required: [id]
        '202':
          description: Scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  send_at:
                    type: string
                    format: date-time
                required: [id, send_at]
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/import:
    post:
      summary: Import a raw message
      description: Store a raw RFC 5322 message directly into a folder. Filters are not applied.
      parameters:
        - name: folder_id
          in: query
          schema:
            type: integer
            default: 1
            description: Target folder (default Inbox).
      requestBody:
        required: true
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                required: [id]
        '400':
          $ref: '#/components/responses/BadRequest'

  /messages/{id}:
    get:
      summary: Get message details
      description: Get full message including body and attachment list. Does not alter read state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update message metadata
      description: |
        Partial update of folder_id, read, or flagged. Moving to/from Scheduled or Snoozed
        folders is rejected; use the dedicated snooze and scheduled endpoints instead.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_id:
                  type: integer
                read:
                  type: boolean
                flagged:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete message
      description: If not in Trash, moves to Trash. If already in Trash, permanently deletes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'

  /messages:
    patch:
      summary: Bulk update messages
      description: |
        Apply the same patch to multiple messages. Same move restrictions as single PATCH.
        Returns 404 if any of the provided IDs does not exist; no changes are made in that case.
        Returns 400 if more than 1000 IDs are supplied (the `maxItems: 1000` constraint on the `ids`
        array is the enforced limit); no changes are made in that case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  maxItems: 1000
                folder_id:
                  type: integer
                read:
                  type: boolean
                flagged:
                  type: boolean
              required: [ids]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Bulk delete messages
      description: |
        Same two-step semantics as single delete.
        Returns 404 if any of the provided IDs does not exist; no changes are made in that case.
        Returns 400 if more than 1000 IDs are supplied (the `maxItems: 1000` constraint on the `ids`
        array is the enforced limit); no changes are made in that case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  maxItems: 1000
              required: [ids]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                required: [deleted]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /messages/{id}/raw:
    get:
      summary: Download raw message
      description: Download the original RFC 5322 message file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="message.eml"'
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /messages/{id}/thread:
    get:
      summary: Get thread
      description: |
        Returns all messages in the same thread, ordered by date ascending.

        **Thread membership algorithm (applied in order):**
        1. **Header-based (primary):** Build a directed graph where message A links to message B if
           B's `Message-ID` appears in A's `In-Reply-To` or A's `References` list. Take the transitive
           closure of this graph to find all messages connected to the requested message. The requested
           message itself is always included.
        2. **Subject-based fallback:** If header-based grouping yields only the single requested message
           (no links found to any other stored message), group by normalised subject: strip leading
           reply/forward prefixes (any combination, case-insensitive) — `Re:`, `Fwd:`, `Fw:`, `AW:`,
           `WG:`, `RES:`, `ENC:`, `VS:`, `SV:` — and compare the remainder case-insensitively.

        The endpoint includes messages from all folders (Inbox, Sent, Trash, Snoozed, etc.) so the
        full conversation is always visible.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageSummary'
                required: [messages]
        '404':
          $ref: '#/components/responses/NotFound'

  /messages/{id}/snooze:
    post:
      summary: Snooze a message
      description: |
        Temporarily hide a message until a future time. The message must be in Inbox or a user
        folder. System folders (Sent, Trash, Junk, Scheduled, Snoozed) are not allowed because
        each has its own specific semantics that would conflict with snooze behaviour.
        `until` must be a future timestamp at least 1 minute ahead.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                until:
                  type: string
                  format: date-time
              required: [until]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  folder_id:
                    type: integer
                  snoozed_until:
                    type: string
                    format: date-time
                required: [id, folder_id, snoozed_until]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Cancel snooze
      description: Cancel a snooze early, returning the message to its original folder immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  folder_id:
                    type: integer
                required: [id, folder_id]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /messages/{id}/mark-junk:
    post:
      summary: Mark message as junk
      description: Moves the message to the Junk folder and marks it as read. Returns 400 if already in Junk.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  folder_id:
                    type: integer
                required: [id, folder_id]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /messages/{id}/mark-not-junk:
    post:
      summary: Mark message as not junk
      description: Moves the message from Junk to Inbox and marks it as unread. Returns 400 if not in Junk.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  folder_id:
                    type: integer
                required: [id, folder_id]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Attachments ────────────────────────────────────────────────────────────

  /attachments/{id}:
    get:
      summary: Download attachment
      description: |
        Download attachment data. Always served as `application/octet-stream` regardless of the
        stored `content_type` (which originates from the untrusted sender). The
        `Content-Disposition: attachment; filename="..."` header uses the stored filename with
        CR, LF, and NUL characters stripped to prevent header injection.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="report.pdf"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Scheduled ──────────────────────────────────────────────────────────────

  /scheduled/{id}:
    delete:
      summary: Cancel scheduled message
      description: Cancel a scheduled message and move it to Drafts. Returns 400 if already sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  folder_id:
                    type: integer
                required: [id, folder_id]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Drafts ─────────────────────────────────────────────────────────────────

  /drafts:
    post:
      summary: Save new draft
      description: |
        Save a new draft. Nothing is sent. `send_at`, if supplied, is stored but not acted upon.
        If `source_message_id` is supplied, all attachments from that message are copied into the
        new draft atomically (used when forwarding a message).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
                required: [id, updated_at]
        '400':
          $ref: '#/components/responses/BadRequest'

  /drafts-with-attachments:
    post:
      summary: Save new draft with attachments
      description: Same as POST /drafts but uses multipart/form-data.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                message:
                  $ref: '#/components/schemas/DraftRequest'
                attachments:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
                required: [id, updated_at]
        '400':
          $ref: '#/components/responses/BadRequest'

  /drafts/{id}:
    put:
      summary: Replace draft content
      description: |
        Replace an existing draft entirely. All content fields are replaced; if `send_at` is absent
        or null, any previously stored value is cleared. `source_message_id` is ignored on PUT.
        **Attachments are not modified by this endpoint** — existing attachment rows remain unchanged.
        Use `DELETE /drafts/{id}/attachments/{attachment_id}` to remove individual attachments, or
        `PUT /drafts-with-attachments/{id}` to replace all attachments wholesale.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
                required: [id, updated_at]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete draft
      description: Permanently delete a draft (no Trash step).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /drafts/{id}/attachments/{attachment_id}:
    delete:
      summary: Remove a single attachment from a draft
      description: |
        Delete one attachment from an existing draft without affecting the other attachments
        or any other draft fields. Returns 404 if the draft or attachment does not exist, or
        400 if the attachment does not belong to the specified draft.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attachment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Attachment deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /drafts-with-attachments/{id}:
    put:
      summary: Replace draft content with attachments
      description: Same as PUT /drafts/{id} but uses multipart/form-data. Existing attachments are replaced wholesale.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                message:
                  $ref: '#/components/schemas/DraftRequest'
                attachments:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
                required: [id, updated_at]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Filters ────────────────────────────────────────────────────────────────

  /filters:
    get:
      summary: List filters
      description: Returns all filters ordered by position.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Filter'
    post:
      summary: Create filter
      description: |
        Create a filter. At least one of `match_from`, `match_to`, `match_subject` must be
        non-empty. A field is considered non-empty if it is not `null`, not `""`, and not a
        whitespace-only string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '400':
          $ref: '#/components/responses/BadRequest'

  /filters/{id}:
    put:
      summary: Replace filter
      description: Replace a filter entirely.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete filter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /filters/reorder:
    patch:
      summary: Reorder filters
      description: Update position values for multiple filters at once. The supplied order becomes the new position sequence (0, 1, 2, …).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
              required: [ids]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]

  # ── Spam Filter ────────────────────────────────────────────────────────────

  /spam-filter:
    get:
      summary: Get spam filter settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpamFilterSettings'
    put:
      summary: Replace spam filter settings
      description: |
        Replace spam filter settings entirely. `score_threshold` must be positive;
        `score_header` must be non-empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpamFilterSettings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpamFilterSettings'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Identities ─────────────────────────────────────────────────────────────

  /identities:
    get:
      summary: List identities
      description: Returns all identities ordered by position, then id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Identity'
    post:
      summary: Create identity
      description: |
        Create an identity. `address` must be a valid RFC 5322 addr-spec.
        If `is_default` is true, all other identities are set to is_default=false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /identities/{id}:
    put:
      summary: Replace identity
      description: Replace an identity entirely. Same validation as POST.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete identity
      description: Delete an identity. Returns 400 if it is the only identity. If the default is deleted, the next identity by position/id is promoted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /identities/reorder:
    patch:
      summary: Reorder identities
      description: Update position values for multiple identities at once. The supplied order becomes the new position sequence (0, 1, 2, …).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
              required: [ids]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]

  # ── Contacts ───────────────────────────────────────────────────────────────

  /contacts:
    get:
      summary: List contacts
      description: |
        List contacts ordered by name (empty names last), then address. Supports autocomplete filtering.
        When used for address-field autocomplete dropdowns, clients should send `limit=10`. If `total`
        exceeds the requested limit, the UI should show a "type more to narrow" hint rather than paginating.
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 500
          description: Case-insensitive substring filter on name or address.
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                required: [total, contacts]
    post:
      summary: Create contact
      description: Create a contact. `address` must be a valid RFC 5322 addr-spec.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                name:
                  type: string
                  maxLength: 200
              required: [address]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /contacts/{id}:
    put:
      summary: Replace contact
      description: Replace a contact entirely. Returns 409 if the new address conflicts with a different existing contact.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                name:
                  type: string
                  maxLength: 200
              required: [address]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Health ─────────────────────────────────────────────────────────────────

  /health:
    get:
      summary: Liveness check
      description: |
        Returns 200 when the server is ready to serve requests. Intended for reverse proxy health
        checks and container readiness probes. Does not require authentication. Does not perform a
        database query — it only checks that the HTTP server is running.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                required: [status]
